[package]
name = "vsr-rs"
version = "0.1.0"
edition = "2021"

[lib]
path = "lib.rs"

[workspace]
members = ["bench", "simulator"]

[dependencies]
log = "0.4.17"

[dev-dependencies]
anyhow = "1"
env_logger = "0.9.1"
# The kvstore example persists the replica's log with writeahead and its
# state with fjall.
fjall = "3.1.10"
futures = "0.3"
# writeahead logs through tracing, whose `log` feature hands its records to
# env_logger.
tracing = { version = "0.1", features = ["log"] }
writeahead = "0.4.1"

[[example]]
name = "kvstore"
test = true
