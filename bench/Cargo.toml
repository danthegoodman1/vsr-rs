[package]
name = "vsr-bench"
version = "0.1.0"
edition = "2021"
description = "Benchmarks of the library alone and of the kvstore's event loop"
publish = false
default-run = "vsr-bench"

[[bin]]
name = "vsr-bench"
path = "src/main.rs"

[dependencies]
anyhow = "1"
env_logger = "0.9.1"
fjall = "3.1.10"
futures = "0.3"
log = "0.4.17"
rand = "0.8.5"
rand_chacha = "0.3.1"
# writeahead logs through tracing, whose `log` feature hands its records to
# env_logger.
tracing = { version = "0.1", features = ["log"] }
vsr-rs = { path = ".." }
writeahead = "0.4.1"

[[bin]]
name = "vsr-micro"
path = "src/micro.rs"
